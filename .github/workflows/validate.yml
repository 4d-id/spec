name: validate
on: [push, pull_request]
jobs:
  specification-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conformance/requirements.txt
      - name: Install artifact validators
        run: python -m pip install -r conformance/requirements.txt
      - name: Validate exact normative linkage, schemas, OpenAPI, and partial shape fixtures
        run: python conformance/validate.py
